version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ai_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Placeholder for backend-api
  # backend-api:
  #   build: ./apps/backend-api
  #   depends_on:
  #     - postgres
  #     - redis
  #   environment:
  #     DATABASE_URL: postgresql+asyncpg://user:password@postgres:5432/ai_platform
  #     REDIS_URL: redis://redis:6379/0

volumes:
  postgres_data:
